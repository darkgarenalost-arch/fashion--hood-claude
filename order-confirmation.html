    <title>Order Confirmed | Fashion Hood</title>
    <meta name="description" content="Fashion Hood order confirmation page.">
    <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
  </head>
  <body class="light-page">
    <header id="site-header"></header>
    <main>
      <section class="page-hero">
        <div class="container">
          <div class="summary-card max-w-2xl">
            <span class="eyebrow">Confirmed</span>
            <h1 class="section-title mt-4">Your order is placed.</h1>
            <p class="muted mt-4" id="order-copy"></p>
            <div class="button-row">
              <a class="btn-dark" href="products/">Continue shopping</a>
              <a class="btn-soft" href="account.html">View saved orders</a>
            </div>
          </div>
        </div>
      </section>
    </main>
    <footer class="footer" id="site-footer"></footer>
    <a class="whatsapp-float" id="whatsapp-float">WA</a>
    <nav class="mobile-nav" id="mobile-nav"></nav>
    <script type="module">
      import { renderShell, getParam } from "./js/utils.js";
      renderShell("account");
      document.querySelector("#order-copy").textContent = `Order ID: ${getParam("id") || "saved"} · Payment: ${getParam("method") || "COD"}. You will receive a confirmation call or WhatsApp update soon.`;
    </script>
  </body>
