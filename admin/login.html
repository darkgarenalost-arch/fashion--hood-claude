<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Login | Fashion Hood</title>
    <meta name="robots" content="noindex,nofollow">
    <link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/styles.css">
  </head>
  <body>
    <main class="page-shell min-h-screen grid place-items-center p-4">
      <form class="summary-card w-full max-w-md" id="admin-login-form">
        <div class="brand-lockup mb-6">
          <img src="../assets/images/logo.svg" alt="" class="brand-mark">
          <span>Fashion Hood</span>
        </div>
        <span class="eyebrow">Secure admin</span>
        <h1 class="section-title mt-4">Login</h1>
        <p class="muted mt-3">Use the Firebase Auth account that has been added to the admins collection.</p>
        <div class="field mt-6"><label>Email</label><input name="email" type="email" required></div>
        <div class="field mt-4"><label>Password</label><input name="password" type="password" required></div>
        <button class="btn-primary w-full mt-6" type="submit">Enter dashboard</button>
      </form>
    </main>
    <script type="module" src="admin.js"></script>
  </body>
</html>
