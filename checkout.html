<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Checkout | Fashion Hood</title>
    <meta name="description" content="Fashion Hood COD and Razorpay checkout with address, WhatsApp number and order summary.">
    <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <link rel="stylesheet" href="css/styles.css">
  </head>
  <body class="light-page">
    <header id="site-header"></header>
    <main>
      <section class="page-hero">
        <div class="container">
          <span class="eyebrow">COD highlighted</span>
          <h1 class="section-title mt-4">Checkout built for fast decisions</h1>
          <p class="muted mt-4 max-w-2xl">Add delivery details, apply a coupon and choose Cash On Delivery or Razorpay test payment.</p>
        </div>
      </section>
      <section class="section pt-0">
        <div class="container checkout-grid">
          <form class="summary-card" id="checkout-form">
            <h2 class="font-black text-2xl mb-5">Delivery details</h2>
            <div class="form-grid">
              <div class="field"><label>Full name</label><input name="name" required autocomplete="name"></div>
              <div class="field"><label>Mobile number</label><input name="phone" required inputmode="tel" autocomplete="tel"></div>
              <div class="field"><label>WhatsApp number</label><input name="whatsapp" inputmode="tel"></div>
              <div class="field"><label>Email</label><input name="email" type="email" autocomplete="email"></div>
              <div class="field full"><label>Address</label><textarea name="address" rows="3" required autocomplete="street-address"></textarea></div>
              <div class="field"><label>City</label><input name="city" required></div>
              <div class="field"><label>State</label><input name="state" required></div>
              <div class="field"><label>Pincode</label><input name="pincode" required inputmode="numeric" autocomplete="postal-code"></div>
              <div class="field"><label>Landmark</label><input name="landmark"></div>
            </div>

            <h2 class="font-black text-2xl mt-8 mb-4">Payment method</h2>
            <label class="payment-card primary">
              <input type="radio" name="paymentMethod" value="COD" checked>
              <span><strong>Cash On Delivery</strong><br><small class="muted">Pay when your Fashion Hood order arrives.</small></span>
            </label>
            <label class="payment-card mt-3">
              <input type="radio" name="paymentMethod" value="Razorpay">
              <span><strong>Razorpay Online Payment</strong><br><small class="muted">Cards, UPI, wallets and netbanking in test mode.</small></span>
            </label>
            <button class="btn-primary w-full mt-6" type="submit" id="place-order">Place COD order</button>
          </form>

          <aside class="summary-card" id="checkout-summary"></aside>
        </div>
      </section>
    </main>
    <footer class="footer" id="site-footer"></footer>
    <a class="whatsapp-float" id="whatsapp-float">WA</a>
    <nav class="mobile-nav" id="mobile-nav"></nav>
    <script type="module" src="js/checkout.js"></script>
  </body>
</html>
